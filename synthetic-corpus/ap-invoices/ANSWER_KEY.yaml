  # ===========================================================================
  # WORKFLOWS
  # ===========================================================================

  - id: WF-001
    type: workflow
    statement: >-
      Invoice entry and posting:
      (1) validate the header (vendor, invoice #, dates, AP closed month);
      (2) validate the lines;
      (3) warn if a lien waiver is missing;
      (4) run the duplicate check, with a CTRL/CFO override;
      (5) insert the header (status O) and the lines;
      (6) usp_APInvPost re-checks the GL month, vendor, 1099 TIN, balance and duplicates, computes
          retainage (adding a RET hold), then routes to P or A;
      (7) on the A path, SYSTEM approval applies the LW and INS holds.
    locations:
      - {file: ClientSide/AP/AP/frmAPInvoiceEntry.vb, start_line: 141, end_line: 226}
      - {file: Scripts/StoredProcedures/usp_APInvPost.sql, start_line: 20, end_line: 144}
    evidence_class: Verified
    flags: []

  - id: WF-002
    type: workflow
    statement: >-
      Approval: the approver opens the P queue (PMs see only their own jobs by default). The UI pre-checks
      segregation of duties and the role limit. usp_APInvApprove 'A' re-checks status, segregation of
      duties and limit, sets the invoice to A, then applies the LW and INS holds (A->H, return 1). The
      reject path (needs a reason) returns the invoice to O.
    locations:
      - {file: ClientSide/AP/AP/frmAPInvoiceApproval.vb, start_line: 79, end_line: 117}
      - {file: Scripts/StoredProcedures/usp_APInvApprove.sql, start_line: 21, end_line: 150}
    evidence_class: Verified
    flags: []

  - id: WF-003
    type: workflow
    statement: >-
      Payment hold maintenance: look up the invoice; add a manual DSP or MGR hold (A->H); release a hold
      after the UI authority check, the proc authority check and hold-specific checks (INS: certificates
      must be current; LW: sets the waiver flag; RET: job must be complete). When no blocking holds remain,
      the status returns to A. "Can Pay" lists the reasons payment is blocked.
    locations:
      - {file: ClientSide/AP/AP/frmAPPaymentHold.vb, start_line: 46, end_line: 128}
      - {file: Scripts/StoredProcedures/usp_APHoldRelease.sql, start_line: 16, end_line: 115}
      - {file: ClientSide/AP/AP/clsAPInvoiceBL.vb, start_line: 232, end_line: 263}
    evidence_class: Verified
    flags: []

  - id: WF-004
    type: workflow
    statement: >-
      Retainage lifecycle: the per-line retainage shown at entry is recomputed by the proc at post. A RET
      hold is placed and the retained amount is excluded from OpenPayable. When the job reaches JobStatus
      2 or 3, CTRL or CFO releases the RET hold, RetgRelAmt is set to RetgAmt, and report 412 shows the
      retainage as payable.
    locations:
      - {file: Scripts/StoredProcedures/usp_APRetgCompute.sql, start_line: 17, end_line: 83}
      - {file: Scripts/StoredProcedures/usp_APHoldRelease.sql, start_line: 88, end_line: 92}
      - {file: Scripts/Reports/412.sql, start_line: 23, end_line: 25}
    evidence_class: Verified
    flags: []

