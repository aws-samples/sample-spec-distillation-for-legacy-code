      must_change:
        - {file: Scripts/Tables/JC_Tables.sql, start_line: 18, end_line: 18, why: "COApprThreshold default"}
        - {file: Scripts/Tables/JC_Tables.sql, start_line: 220, end_line: 220, why: "JCCoParm seed row (or UPDATE in prod)"}
        - {file: Scripts/Tables/JC_Tables.sql, start_line: 232, end_line: 232, why: "JCCOApprLim PM row - proc also checks role MaxAmt"}
        - {file: ClientSide/JC/JC/modJCGlobals.vb, start_line: 39, end_line: 42, why: "CO_PM_LIMIT hardcoded copy"}
        - {file: Scripts/Reports/615.sql, start_line: 31, end_line: 31, why: "hardcoded 50000 ExecReq"}
      must_review:
        - {file: ClientSide/JC/JC/modJCGlobals.vb, start_line: 67, end_line: 68, why: "PM role limit returns CO_PM_LIMIT"}
        - {file: ClientSide/JC/JC/clsJCCOBL.vb, start_line: 144, end_line: 146, why: "RequiresExecApproval uses >= (boundary differs from proc)"}
        - {file: ClientSide/JC/JC/clsJCCOBL.vb, start_line: 158, end_line: 159, why: "message text built from CO_PM_LIMIT"}
        - {file: ClientSide/JC/JC/frmJCCOEntry.vb, start_line: 78, end_line: 78, why: "label text"}
        - {file: ClientSide/JC/JC/frmJCCOEntry.vb, start_line: 186, end_line: 186, why: "label visibility uses >"}
        - {file: Scripts/StoredProcedures/usp_JCCOApprove.sql, start_line: 92, end_line: 92, why: "reads COApprThreshold"}
        - {file: Scripts/StoredProcedures/usp_JCCOApprove.sql, start_line: 97, end_line: 106, why: "threshold and role limit checks"}
        - {file: ClientSide/JC/JC/frmJCCOApproval.vb, start_line: 38, end_line: 38, why: "shows limit from hardcoded copy"}
        - {file: "Reports/JC Job Cost/JC Approved Change Order Log (615).txt", start_line: 44, end_line: 44, why: "footer legend"}
        - {file: ClientSide/JC/JC/clsJCFieldSync.vb, start_line: 91, end_line: 91, why: "requiresExecApproval in export payload"}
    affected_rules: [BR-009, BR-010]
    affected_reports: [615]
    affected_external_contract: >-
      Yes. The export field requiresExecApproval changes meaning for COs between $50k and $75k. Downstream
      field app consumers should be told.
    affected_tests:
      - "approval screen boundary at 75,000.00 vs 75,000.01"
      - "report 615 ExecReq flag"
      - "export payload requiresExecApproval flag"
    notes: >-
      Fixing only the DB parameter leaves the screens, report and export on $50k. Fixing only CO_PM_LIMIT
      leaves the proc on $50k. The JCCOApprLim PM row also caps PMs at $50k, so it must move too.

