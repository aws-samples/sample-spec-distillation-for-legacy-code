#
# Change-impact key - synthetic JC Change Orders corpus. Tests the "impact analysis" benefit: given a change
# request, does the tool find EVERY place that must change (including every duplicated copy)?
# Paths are relative to synthetic-corpus/jc-changeorders/. Line ranges are 1-based, inclusive.
#
# affected_locations: must_change = code/data that must be edited for the change to be correct everywhere
#                     must_review = behaviour depends on it; review / retest, may not need an edit
# affected_tests: the corpus has NO automated tests; listed entries are the manual / regression checks a
#                 complete answer should call out (report, external contract, screens).
# Scoring hint: recall over must_change locations is the primary metric; missing a duplicated copy is a miss.

corpus: jc-changeorders
version: 1

scenarios:

