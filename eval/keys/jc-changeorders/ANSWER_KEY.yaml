#
# ANSWER KEY - synthetic JC Change Orders corpus (construction contractor ERP, VB.NET + SQL Server)
# Kept OUTSIDE the corpus so tools under test cannot see it.
# All file paths are relative to synthetic-corpus/jc-changeorders/. Line ranges are 1-based and inclusive.
#
# type:            rule | state | workflow | exception
# evidence_class:  Verified | Inferred | Unknown | Confirmation Required
#   Verified              - the code states the behavior directly, and the layers agree
#   Inferred              - follows from combining code paths, or from the absence of code (e.g. no callers)
#   Unknown               - the corpus does not contain the code that would settle it
#   Confirmation Required - the code is contradictory or the rule exists only as prose; a business owner must decide
# flags (trap flags):
#   duplicated_logic | logic_flaw | undocumented_feature | inconsistency | dead_code | comment_only | db_only
#
# PRIMARY seeded traps:
#   duplicated_logic      BR-003 (markup/total, 4 copies), BR-009 (PM threshold, 6+ copies), BR-022 (sub CO cap, 4 copies)
#   logic_flaw            BR-027 (Save & Approve bypasses approval proc), BR-028 (deducts bypass all limits),
#                         BR-029 (report 615 end-date boundary)
#   undocumented_feature  BR-007 (silent 5% sub markup cap), BR-024 (T&M owner CO auto-approval),
#                         BR-025 (hidden support-desk override)
#   inconsistency         BR-006 (max markup UI 20% vs DB 15%), BR-019 (soft-closed jobs: UI blocks, DB allows)
#   dead_code             BR-031 (fee-on-fee)
#   comment_only          BR-030 (owner countersignature before approval)
#   db_only               BR-016 (exported approved COs cannot be voided)
# Secondary / incidental traps are flagged on other items too.

corpus: jc-changeorders
module: JC
version: 1

items:

