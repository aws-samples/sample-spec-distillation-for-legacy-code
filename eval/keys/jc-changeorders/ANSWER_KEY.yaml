  - id: BR-020
    type: rule
    statement: >-
      A Value Engineering (VAL) CO must be a deduct (total < 0). The BL checks this on save and
      usp_JCCOSubmit on submit (return 9). Field requests cannot have negative amounts, so a VAL field
      request can never be submitted.
    locations:
