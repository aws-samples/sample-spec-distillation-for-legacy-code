      - {file: ClientSide/JC/JC/frmJCCOEntry.vb, start_line: 175, end_line: 175}
    evidence_class: Verified
    flags: [undocumented_feature]

  - id: BR-008
    type: rule
    statement: >-
      Sales tax applies only to items flagged taxable (TaxYN = 'Y'), at the job's TaxRate, on cost only.
      Markup is not taxed.
    locations:
