  - id: BR-013
    type: rule
    statement: >-
      Only a Pending Approval CO can be approved or rejected. Rejecting needs a reason. It sets status R,
      saves RejReason and clears ApprBy/ApprDate. The proc does not check the rejecting user's role; only the
      UI stops ENTRY users.
