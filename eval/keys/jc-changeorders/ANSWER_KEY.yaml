      - {file: ClientSide/JC/JC/frmJCCOEntry.vb, start_line: 219, end_line: 222}
      - {file: Scripts/Tables/JC_Tables.sql, start_line: 21, end_line: 21}
      - {file: Scripts/Tables/JC_Tables.sql, start_line: 67, end_line: 67}
    evidence_class: Confirmation Required
    flags: [duplicated_logic, inconsistency]

