  - id: BR-027
    type: rule
    statement: >-
      Save & Approve bypasses approval. It calls clsJCCODAL.SetStatus with a direct UPDATE (D -> A, which
      the trigger allows), never calling usp_JCCOSubmit or usp_JCCOApprove. So the person entering the CO
      approves it (no segregation of duties), and none of the proc checks run: role limit table, sub open,
      insurance, sub CO cap (the BL check uses CurCost), notice period, VAL deduct, server-side recompute and
      the 5% sub markup cap. The stored amounts stay as the screen preview, and SubmitDate stays null.
    locations:
      - {file: ClientSide/JC/JC/frmJCCOEntry.vb, start_line: 268, end_line: 279}
      - {file: ClientSide/JC/JC/clsJCCODAL.vb, start_line: 199, end_line: 207}
      - {file: Scripts/Triggers/trg_JCCOHdr_u.sql, start_line: 45, end_line: 45}
      - {file: ClientSide/JC/JC/clsJCCOBL.vb, start_line: 169, end_line: 173}
      - {file: ClientSide/JC/JC/frmJCCOEntry.vb, start_line: 241, end_line: 241}
    evidence_class: Inferred
    flags: [logic_flaw]

