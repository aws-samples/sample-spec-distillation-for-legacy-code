  - id: BR-001
    type: rule
    statement: >-
      Change order numbers are per job, 3 characters, zero padded (001-999), assigned as MAX(CONum)+1.
      Numbers are never reused (void COs keep theirs). After 999 the job cannot take more COs (return 2).
      Office entry and field import both use usp_JCCONextNum.
    locations:
