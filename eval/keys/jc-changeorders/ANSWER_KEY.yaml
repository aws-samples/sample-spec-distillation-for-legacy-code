      - {file: Scripts/StoredProcedures/usp_JCCOFieldImport.sql, start_line: 85, end_line: 89}
    evidence_class: Verified
    flags: []

  - id: BR-006
    type: rule
    statement: >-
      Maximum markup disagrees across layers. The UI and BL allow 0-20% (MAX_MARKUP_PCT = 20). The database
      allows at most 15%: check constraint ckJCCOHdr_Mkup BETWEEN 0 AND 15, JCCoParm.MaxMarkupPct = 15 and
      the usp_JCCOSubmit check (return 8). A markup between 15% and 20% passes the screen, then fails the
      first save with a raw constraint error ("Save failed: ...").
    locations:
      - {file: ClientSide/JC/JC/modJCGlobals.vb, start_line: 47, end_line: 47}
      - {file: ClientSide/JC/JC/clsJCCOBL.vb, start_line: 107, end_line: 110}
      - {file: ClientSide/JC/JC/frmJCCOEntry.vb, start_line: 143, end_line: 151}
      - {file: Scripts/Tables/JC_Tables.sql, start_line: 20, end_line: 20}
      - {file: Scripts/Tables/JC_Tables.sql, start_line: 114, end_line: 114}
      - {file: Scripts/StoredProcedures/usp_JCCOSubmit.sql, start_line: 67, end_line: 74}
      - {file: ClientSide/JC/JC/frmJCCOEntry.vb, start_line: 231, end_line: 235}
    evidence_class: Confirmation Required
    flags: [inconsistency]

  - id: BR-007
    type: rule
    statement: >-
      Subcontract COs have their markup silently capped at 5% when submitted. MarkupAmt is computed at 5%,
      but the stored MarkupPct keeps the entered value, and there is no message. The entry preview shows the
      uncapped markup, and report 615 recomputes markup from the stored (uncapped) MarkupPct.
    locations:
