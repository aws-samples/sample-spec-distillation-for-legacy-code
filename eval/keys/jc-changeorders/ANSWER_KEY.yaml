  - id: BR-022
    type: rule
    statement: >-
      Subcontract CO cap: total COs on a subcontract cannot exceed MaxCOPct (default JCCoParm.DfltMaxCOPct
      25%) of the original subcontract value. The logic exists in four places, with different definitions of
      "used". usp_JCCOApprove (authoritative) sums CostAmt of S COs in status A or I. clsJCCOBL.CheckSubCap,
      SubCapRemaining and the subcontract maintenance screen use CurCost - OrigCost, which only counts posted
      (I) COs, so approved-but-unposted COs are ignored. The screens therefore show more remaining capacity
      than the approval proc will allow.
    locations:
