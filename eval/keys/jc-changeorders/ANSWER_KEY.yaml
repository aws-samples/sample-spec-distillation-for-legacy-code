      - {file: ClientSide/JC/JC/modJCGlobals.vb, start_line: 39, end_line: 42}
      - {file: ClientSide/JC/JC/modJCGlobals.vb, start_line: 67, end_line: 68}
      - {file: ClientSide/JC/JC/clsJCCOBL.vb, start_line: 144, end_line: 146}
