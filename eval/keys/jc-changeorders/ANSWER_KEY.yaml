    type: rule
    statement: >-
      A subcontract CO must be submitted within JCCoParm.NoticeDays (21) calendar days of its request date:
      day 21 passes, day 22 fails (return 10). This is checked only at submit, with no warning on the entry
      screen.
    locations:
