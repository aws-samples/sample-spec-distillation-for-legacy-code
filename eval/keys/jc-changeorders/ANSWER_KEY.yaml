    evidence_class: Verified
    flags: []

  - id: BR-016
    type: rule
    statement: >-
      An approved CO that has already been exported to the field app (ExpFlag = 'Y') cannot be voided. Only
      the update trigger enforces this, with a generic "Change order cannot be voided." message. The BL
      CanVoid and the entry screen still allow and offer Void for approved COs.
    locations:
