  - id: BR-009
    type: rule
    statement: >-
      A PM can approve COs up to the executive threshold of $50,000; larger COs need PX/VP/CFO. The number
      is held in several places: JCCoParm.COApprThreshold (default and seed), the JCCOApprLim PM row,
      modJCGlobals.CO_PM_LIMIT (also used as the PM role limit), the entry-screen label, report 615
      (hardcoded 50000 and footer text) and the field export flag requiresExecApproval. The comparison at
      the boundary differs. clsJCCOBL.RequiresExecApproval uses >= (it blocks a PM at exactly $50,000.00,
      and the field export says requiresExecApproval = true). The proc, entry label and report use >
      (exactly $50,000.00 is within PM authority).
    locations:
