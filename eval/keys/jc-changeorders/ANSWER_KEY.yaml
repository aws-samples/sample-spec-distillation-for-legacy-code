      - {file: ClientSide/JC/JC/modJCGlobals.vb, start_line: 107, end_line: 110}
      - {file: ClientSide/JC/JC/clsJCCODAL.vb, start_line: 104, end_line: 116}
      - {file: Scripts/StoredProcedures/usp_JCCOFieldImport.sql, start_line: 78, end_line: 83}
    evidence_class: Verified
    flags: []

  - id: BR-002
    type: rule
    statement: >-
      A change order is Owner (O), Subcontract (S) or Internal (I). A subcontract CO must name a subcontract.
      The UI/BL and the field import check this. No DB constraint enforces SL for type S. Field requests
      may only be OWNER or SUB, never Internal.
    locations:
      - {file: Scripts/Tables/JC_Tables.sql, start_line: 76, end_line: 76}
      - {file: Scripts/Tables/JC_Tables.sql, start_line: 112, end_line: 112}
      - {file: ClientSide/JC/JC/clsJCCOBL.vb, start_line: 90, end_line: 96}
      - {file: ClientSide/JC/JC/clsJCFieldSync.vb, start_line: 152, end_line: 160}
      - {file: Scripts/StoredProcedures/usp_JCCOFieldImport.sql, start_line: 54, end_line: 58}
    evidence_class: Verified
    flags: []

  - id: BR-003
    type: rule
    statement: >-
      CO amounts: item Amount = ROUND(Units x UnitCost, 2). Cost = sum of item amounts. Markup = Cost x
      MarkupPct / 100. Tax = taxable cost x job TaxRate. Total = Cost + Markup + Tax. The calculation is
      written four times: (1) usp_JCCOSubmit, which is authoritative and overwrites the stored header
      amounts on submit; (2) the entry form preview RecalcPreview, which rounds markup and tax per line
      (MidpointRounding.AwayFromZero) and then sums; (3) clsJCCOBL.CalcTotals, which uses Math.Round
      banker's rounding on the totals and has no callers; (4) the report 615 formula @MarkupEarned/@LineTotal,
      which recomputes markup from the stored MarkupPct and ignores the 5% sub cap. The stored
      MarkupAmt/TotalAmt from the proc win, except for COs approved through Save & Approve, which keep the
      form preview totals (see BR-027).
    locations:
      - {file: Scripts/StoredProcedures/usp_JCCOSubmit.sql, start_line: 79, end_line: 92}
      - {file: Scripts/StoredProcedures/usp_JCCOSubmit.sql, start_line: 114, end_line: 123}
      - {file: ClientSide/JC/JC/frmJCCOEntry.vb, start_line: 164, end_line: 188}
      - {file: ClientSide/JC/JC/clsJCCOBL.vb, start_line: 49, end_line: 65}
      - {file: "Reports/JC Job Cost/JC Approved Change Order Log (615).txt", start_line: 31, end_line: 32}
      - {file: ClientSide/JC/JC/clsJCCODAL.vb, start_line: 187, end_line: 197}
    evidence_class: Confirmation Required
    flags: [duplicated_logic, inconsistency]

  - id: BR-004
    type: rule
    statement: >-
      The entry screen writes its preview totals (per-line rounding) to the header on every save (SaveTotals).
      Submit later overwrites them with the proc's totals (rounding on the sum). So a CO's stored amount can
      change by cents between Save and Submit. The preview total also decides whether Save & Approve is
      offered and whether the executive-approval label shows.
    locations:
      - {file: ClientSide/JC/JC/frmJCCOEntry.vb, start_line: 170, end_line: 187}
      - {file: ClientSide/JC/JC/frmJCCOEntry.vb, start_line: 241, end_line: 241}
      - {file: ClientSide/JC/JC/clsJCCODAL.vb, start_line: 187, end_line: 197}
      - {file: Scripts/StoredProcedures/usp_JCCOSubmit.sql, start_line: 90, end_line: 92}
    evidence_class: Inferred
    flags: [logic_flaw]

  - id: BR-005
    type: rule
    statement: >-
      Default markup is JCCoParm.DfltMarkupPct (10%). The entry screen pre-fills it and falls back to the
      hardcoded DFLT_MARKUP_PCT (10) if the parameters are missing. Field-imported COs always get the company
      default markup.
    locations:
      - {file: Scripts/Tables/JC_Tables.sql, start_line: 19, end_line: 19}
      - {file: ClientSide/JC/JC/frmJCCOEntry.vb, start_line: 72, end_line: 76}
      - {file: ClientSide/JC/JC/modJCGlobals.vb, start_line: 48, end_line: 48}
