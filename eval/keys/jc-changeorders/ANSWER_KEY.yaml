      - {file: ClientSide/JC/JC/frmJCCOEntry.vb, start_line: 78, end_line: 78}
      - {file: ClientSide/JC/JC/frmJCCOEntry.vb, start_line: 186, end_line: 186}
      - {file: Scripts/StoredProcedures/usp_JCCOApprove.sql, start_line: 92, end_line: 92}
      - {file: Scripts/StoredProcedures/usp_JCCOApprove.sql, start_line: 97, end_line: 101}
      - {file: Scripts/Reports/615.sql, start_line: 31, end_line: 31}
      - {file: "Reports/JC Job Cost/JC Approved Change Order Log (615).txt", start_line: 44, end_line: 44}
      - {file: ClientSide/JC/JC/clsJCFieldSync.vb, start_line: 91, end_line: 91}
    evidence_class: Confirmation Required
    flags: [duplicated_logic, inconsistency]

  - id: BR-010
    type: rule
