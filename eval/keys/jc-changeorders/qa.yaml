  - id: QA-01
    audience: engineer
    question: Where is change order markup computed, and which value wins?
    answer_kind: inconsistent
    reference_answer: >-
      There are four copies. (1) usp_JCCOSubmit computes ROUND(Cost * Pct / 100, 2) on the summed cost.
      It caps subcontract COs at 5% and writes MarkupAmt/TotalAmt; this is the stored value and it wins for
      anything submitted. (2) frmJCCOEntry.RecalcPreview rounds per line (AwayFromZero) and sums. SaveTotals
      stores this preview until submit, and it stays permanently for Save & Approve COs. (3)
      clsJCCOBL.CalcTotals uses banker's rounding on the total and has no callers. (4) Report 615
      @MarkupEarned recomputes from the stored MarkupPct and ignores the 5% sub cap, so the report can
      disagree with MarkupAmt.
    locations:
      - {file: Scripts/StoredProcedures/usp_JCCOSubmit.sql, start_line: 87, end_line: 92}
      - {file: ClientSide/JC/JC/frmJCCOEntry.vb, start_line: 164, end_line: 180}
      - {file: ClientSide/JC/JC/clsJCCOBL.vb, start_line: 49, end_line: 65}
      - {file: "Reports/JC Job Cost/JC Approved Change Order Log (615).txt", start_line: 31, end_line: 32}
      - {file: ClientSide/JC/JC/clsJCCODAL.vb, start_line: 187, end_line: 197}
    related_items: [BR-003, BR-004, BR-007, BR-027]

