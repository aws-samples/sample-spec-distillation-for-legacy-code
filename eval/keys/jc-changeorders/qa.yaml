  - id: QA-04
    audience: engineer
    question: In what order does usp_JCCOApprove check an approval, and what can skip those checks?
    answer_kind: definitive
    reference_answer: >-
      The order is: CO exists, then status is P, then (for approve) the user has an active non-ENTRY role,
      then SoD (EntBy != user). Next come the override, and then the PM > threshold and role MaxAmt checks,
      which are skipped when the override is active. For sub COs it then checks SL open, insurance present and
      unexpired, and the cap on A+I cost. On success it sets A, ApprBy, ApprDate and OvrFlag. The checks are
      skipped entirely by Save & Approve, which never calls the proc. The limit checks are skipped by the
      JCAdmUsers override.
    locations:
      - {file: Scripts/StoredProcedures/usp_JCCOApprove.sql, start_line: 40, end_line: 145}
      - {file: ClientSide/JC/JC/frmJCCOEntry.vb, start_line: 268, end_line: 279}
    related_items: [BR-010, BR-011, BR-012, BR-023, BR-025, BR-027]

  - id: QA-05
    audience: engineer
    question: Which code writes committed cost for AP, and what amount does it use?
    answer_kind: definitive
    reference_answer: >-
      usp_JCCOInterface does this when a sub CO is posted (A -> I). It inserts JCCommit rows summed by phase
      and cost type from item Amount, which is cost only with no markup or tax. It also adds CostAmt to
      SLHdr.CurCost.
    locations:
