    answer_kind: inconsistent
    reference_answer: >-
      It depends where it is entered. The office entry screen refuses changes on soft-closed and closed
      jobs. Requests from the field app are accepted for soft-closed jobs, and the system's own submit and
      posting steps only block fully closed jobs. The business needs to decide which rule is intended.
    locations:
