  - id: QA-16
    audience: product
    question: Do owner changes on time-and-material jobs go through approval?
    answer_kind: definitive
    reference_answer: >-
      No. On time-and-material jobs, owner changes are approved automatically by the system the moment they
      are submitted, whatever the amount. The screen still tells the user "Submitted for approval". The
      approved change order log marks them "(auto)".
