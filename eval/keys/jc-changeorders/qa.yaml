  - id: QA-17
    audience: product
    question: What markup can we charge on a subcontractor change?
    answer_kind: inconsistent
    reference_answer: >-
      Users can enter up to 15%; the screen suggests up to 20%, but anything over 15% fails to save. When the
      change is submitted, the system quietly limits the markup on subcontractor changes to 5% and gives no
      message. The entry screen preview and the approved change order log still show the markup at the
      entered rate.
