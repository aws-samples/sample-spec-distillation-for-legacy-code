      - {file: Scripts/Tables/JC_Tables.sql, start_line: 182, end_line: 195}
    related_items: [BR-032]

  - id: QA-06
    audience: engineer
    question: How are CO numbers generated, and is it safe under concurrent entry?
    answer_kind: definitive
    reference_answer: >-
      usp_JCCONextNum returns MAX(CONum)+1 zero padded to 3 (001-999) under UPDLOCK/HOLDLOCK. The office
      form calls it outside any transaction and then inserts on a separate connection, so the lock is
      released in between. Two concurrent saves can get the same number, and the second fails on the
      primary key ("Save failed"). The field import calls it inside its own transaction, so it is safe.
    locations:
      - {file: Scripts/StoredProcedures/usp_JCCONextNum.sql, start_line: 27, end_line: 37}
      - {file: ClientSide/JC/JC/frmJCCOEntry.vb, start_line: 228, end_line: 236}
      - {file: Scripts/StoredProcedures/usp_JCCOFieldImport.sql, start_line: 76, end_line: 83}
    related_items: [BR-001, EX-006]

  - id: QA-07
    audience: engineer
    question: What happens if a user types 18% markup on the entry screen?
    answer_kind: definitive
    reference_answer: >-
      The screen and BL accept it, since MAX_MARKUP_PCT is 20. On the first save, InsertHdr fails the
      ckJCCOHdr_Mkup CHECK (0-15) and the user sees "Save failed: " plus the raw SQL error. If the CO
      already existed, the new markup is not saved at all, because header fields are only written on
      insert. The submit-time check (return 8) is never reached in practice.
    locations:
      - {file: ClientSide/JC/JC/modJCGlobals.vb, start_line: 47, end_line: 47}
      - {file: ClientSide/JC/JC/frmJCCOEntry.vb, start_line: 143, end_line: 151}
      - {file: Scripts/Tables/JC_Tables.sql, start_line: 114, end_line: 114}
      - {file: ClientSide/JC/JC/frmJCCOEntry.vb, start_line: 228, end_line: 241}
      - {file: Scripts/StoredProcedures/usp_JCCOSubmit.sql, start_line: 69, end_line: 74}
    related_items: [BR-006, EX-007]

  - id: QA-08
    audience: engineer
    question: How does the field import avoid creating duplicate change orders when the app retries?
    answer_kind: definitive
    reference_answer: >-
      usp_JCCOFieldImport first looks up ExtRef. If it is found, it returns 1 with the existing CONum, and
      ProcessRequest answers result DUPLICATE with that coNumber. A filtered unique index on JCCOHdr.ExtRef
      backs this up. extRef must be a 36-char GUID.
    locations:
      - {file: Scripts/StoredProcedures/usp_JCCOFieldImport.sql, start_line: 35, end_line: 40}
      - {file: Scripts/Tables/JC_Tables.sql, start_line: 119, end_line: 120}
