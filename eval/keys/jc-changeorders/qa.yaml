  - id: QA-13
    audience: product
    question: Can a project manager approve their own change order?
    answer_kind: inconsistent
    reference_answer: >-
      Normally no. The approval step refuses an approver who entered the change. But there are two
      exceptions. For small changes ($2,500 or less, or any credit), the person entering it can use the
      one-step "Save & Approve" and approve it themselves. And for requests sent from the field app, the
      system records the field app, not the person, as the one who entered it, so the requester is never
      compared to the approver.
    locations:
      - {file: Scripts/StoredProcedures/usp_JCCOApprove.sql, start_line: 82, end_line: 86}
      - {file: ClientSide/JC/JC/frmJCCOEntry.vb, start_line: 268, end_line: 279}
      - {file: Scripts/StoredProcedures/usp_JCCOFieldImport.sql, start_line: 85, end_line: 89}
    related_items: [BR-011, BR-027]

  - id: QA-14
    audience: product
    question: Who is allowed to approve a $300,000 change?
    answer_kind: definitive
    reference_answer: >-
      A vice president (limit $1,000,000) or the CFO (effectively unlimited), and not the person who entered
      it. Project managers stop at $50,000 and project executives at $250,000. A support-desk override also
      exists that lets listed admin users approve without the limit.
    locations:
      - {file: Scripts/Tables/JC_Tables.sql, start_line: 231, end_line: 235}
      - {file: Scripts/StoredProcedures/usp_JCCOApprove.sql, start_line: 95, end_line: 107}
    related_items: [BR-010, BR-025]

