    related_items: [BR-021, BR-027]

  - id: QA-19
    audience: product
    question: Can an approved change be cancelled?
    answer_kind: definitive
    reference_answer: >-
      Yes, it can be voided with a reason while it is approved but not yet posted to the contract. Two cases
      are blocked: once posted, it needs a reversing change instead; and once it has been sent to the field
      app, the void is refused even though the screen offers it.
    locations:
