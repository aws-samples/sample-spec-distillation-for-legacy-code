      - {file: ClientSide/JC/JC/clsJCFieldSync.vb, start_line: 222, end_line: 223}
    related_items: [BR-033]

  - id: QA-09
    audience: engineer
    question: Which checks does the "Save & Approve" button skip compared with the normal submit + approve path?
    answer_kind: definitive
    reference_answer: >-
      All of the proc checks. It does a direct UPDATE Status='A' through SetStatus, so it skips: SoD (the
      enterer approves), JCCOApprLim, sub open and insurance, the proc's sub CO cap (only the weaker BL
      CurCost-based check runs), the notice period, the VAL deduct check at proc level, the server-side
      recompute, and the 5% sub markup cap. Amounts stay as the screen preview, and SubmitDate stays null.
      It is offered to any non-ENTRY role when the preview total is at most $2,500, which includes any
      negative total.
    locations:
      - {file: ClientSide/JC/JC/frmJCCOEntry.vb, start_line: 268, end_line: 279}
      - {file: ClientSide/JC/JC/clsJCCODAL.vb, start_line: 199, end_line: 207}
      - {file: ClientSide/JC/JC/clsJCCOBL.vb, start_line: 169, end_line: 173}
    related_items: [BR-026, BR-027, BR-028]

  - id: QA-10
    audience: engineer
    question: How are database errors surfaced to the user?
    answer_kind: definitive
    reference_answer: >-
      ExecProc catches SqlException and returns 99 with the raw message. The entry form shows "Database
      error: <msg>" for 99. Direct SQL (ExecSql, InsertHdr, ReplaceItems) returns False and sets LastError.
      Trigger violations RAISERROR at severity 11 and roll back.
    locations:
      - {file: ClientSide/JC/JC/clsJCCODAL.vb, start_line: 330, end_line: 353}
      - {file: ClientSide/JC/JC/frmJCCOEntry.vb, start_line: 260, end_line: 261}
      - {file: Scripts/Triggers/trg_JCCOHdr_u.sql, start_line: 81, end_line: 83}
    related_items: [EX-003]

  - id: QA-11
    audience: engineer
    question: How is remaining subcontract CO capacity calculated, and does the screen match the approval check?
    answer_kind: inconsistent
    reference_answer: >-
      The screens compute round(OrigCost * pct / 100, 2) - (CurCost - OrigCost), where pct is MaxCOPct or the
      company default of 25%. This appears in clsJCCOBL.SubCapRemaining/CheckSubCap and in
      frmJCSubcontractMaint.ShowCapacity. CurCost only grows when a CO is posted, so approved-but-unposted COs
      are not counted. usp_JCCOApprove sums the CostAmt of S COs in A or I, so it can reject a CO the
      screen says fits.
    locations:
      - {file: ClientSide/JC/JC/clsJCCOBL.vb, start_line: 180, end_line: 198}
      - {file: ClientSide/JC/JC/frmJCSubcontractMaint.vb, start_line: 66, end_line: 77}
      - {file: Scripts/StoredProcedures/usp_JCCOApprove.sql, start_line: 129, end_line: 137}
      - {file: Scripts/StoredProcedures/usp_JCCOInterface.sql, start_line: 57, end_line: 58}
    related_items: [BR-022]

  - id: QA-12
    audience: engineer
    question: Is there any way to approve a CO above the approver's limit? How would you find out it happened?
    answer_kind: definitive
    reference_answer: >-
      Yes, in three ways. (1) A JCAdmUsers member presses Ctrl+Shift+F12 on the approval screen; the title
      gains a trailing period. The proc then skips the PM threshold and role limit checks and stamps
      OvrFlag = 'Y', and the JCCOAudit note says 'override'. (2) Negative (deduct) COs pass every limit.
      (3) Save & Approve skips the proc, but only for COs whose preview total is at most $2,500.
    locations:
      - {file: ClientSide/JC/JC/frmJCCOApproval.vb, start_line: 61, end_line: 70}
      - {file: Scripts/StoredProcedures/usp_JCCOApprove.sql, start_line: 88, end_line: 107}
      - {file: Scripts/Triggers/trg_JCCOHdr_u.sql, start_line: 68, end_line: 76}
      - {file: Scripts/Tables/JC_Tables.sql, start_line: 106, end_line: 106}
    related_items: [BR-025, BR-028, BR-027]

