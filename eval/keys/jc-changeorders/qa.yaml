      - {file: Scripts/Triggers/trg_JCCOHdr_u.sql, start_line: 51, end_line: 66}
    related_items: [BR-015, BR-016]

  - id: QA-20
    audience: product
    question: What is the biggest change request a field crew can send from the app?
    answer_kind: definitive
    reference_answer: >-
      Up to $25,000 of cost before markup and tax (a company setting), with at most 20 lines. Anything larger
      must be entered in the office. Field requests cannot be credits, and they cannot be internal changes.
    locations:
