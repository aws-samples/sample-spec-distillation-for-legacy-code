  - id: QA-18
    audience: product
    question: How long after the work is requested do we have to submit a subcontractor change?
    answer_kind: definitive
    reference_answer: >-
      21 calendar days from the request date. This is a company setting, and day 21 is still allowed. It is
      only checked when the change is submitted, with no warning earlier. It does not apply to changes
      approved with the one-step Save & Approve.
    locations:
